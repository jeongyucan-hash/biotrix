name: BIOTRIX brand self check
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - uses: actions/checkout@v4
        with:
          ref: hq-nextjs
          path: hq
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public wordmark and links
        run: |
          node site/scripts/check-lockup.mjs
          python3 site/scripts/audit-site.py
      - name: Check independent HQ brand assets
        env:
          HQ_ROOT: ${{ github.workspace }}/hq
          REPORT_PATH: ${{ github.workspace }}/brand-audit-report.json
        run: node hq/scripts/brand-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brand-audit-report
          path: brand-audit-report.json
          retention-days: 7
