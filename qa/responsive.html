<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>BIOTRIX responsive QA</title><style>body{margin:24px;background:#edf2ef;font:14px system-ui;color:#123f36}nav{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}button,select{font:inherit;padding:10px}iframe{display:block;width:390px;height:780px;border:1px solid #b8bec1;background:white}h1{font-size:20px}</style></head><body><h1>BIOTRIX 화면 검수</h1><nav><label>화면 너비 <select id="width"><option>320</option><option selected>390</option><option>768</option><option>1024</option><option>1440</option></select></label><label>페이지 <select id="page"><option value="/">홈</option><option value="/company">브랜드</option><option value="/business">사업</option><option value="/products">제품</option><option value="/partnership">협업</option><option value="/contact">문의</option></select></label></nav><iframe id="preview" src="/" title="반응형 화면"></iframe><script>const frame=document.getElementById('preview');document.getElementById('width').addEventListener('change',e=>frame.style.width=e.target.value+'px');document.getElementById('page').addEventListener('change',e=>frame.src=e.target.value);</script></body></html>
